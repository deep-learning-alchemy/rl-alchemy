[project]
name = "rl-alchemy"
version = "0.1.0"
description = "CS312 Deep Learning Alchemy, Assignment 7: policy gradients on Humanoid and CoinLoop."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "gymnasium[box2d,mujoco]>=1.0,<2",
    "matplotlib",
    "modal>=1.5.3",
    "numpy",
    "torch==2.6.0",
    "wandb==0.31.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
